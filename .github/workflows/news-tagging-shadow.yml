name: Industrial news semantic tagging trial

on:
  workflow_dispatch:
  push:
    branches:
      - codex/news-tagging-shadow
    paths:
      - .github/workflows/news-tagging-shadow.yml
      - experiments/news-tagging/**
      - experiments/news-screening/**
      - experiments/news-filter-v3/business-profile.mjs
      - config/luxshare-business-profile.json
      - outputs/news-screening/audit/4c92e2cb37ce/baseline.json

permissions:
  contents: read

concurrency:
  group: news-tagging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag-frozen-news:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJSON(github.event_name == 'push' && '["a","b","c"]' || '["baseline"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch independent news batch on branch push
        if: github.event_name == 'push'
        env:
          NEWS_TAGGING_SOURCES: experiments/news-tagging/sample-sources-2026-11-10-second-${{ matrix.batch }}.json
          NEWS_TAGGING_MIN_ARTICLES: '10'
        run: |
          node experiments/news-tagging/fetch-fresh.mjs
          echo "NEWS_TAGGING_INPUT=$GITHUB_WORKSPACE/outputs/news-tagging/fresh-batch.json" >> "$GITHUB_ENV"

      - name: Validate adapter and prepare selected batch
        run: |
          node experiments/news-screening/test.mjs
          node experiments/news-tagging/test.mjs
          node experiments/news-tagging/test-compare.mjs
          node experiments/news-tagging/test-model-comparison.mjs
          node experiments/news-tagging/run.mjs --prepare

      - name: Restore successful semantic response cache
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: outputs/news-tagging/cache
          key: news-tagging-7b-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: news-tagging-7b-v1-

      - name: Download and verify pinned runtime
        timeout-minutes: 35
        run: |
          set -euo pipefail
          printf '读取运行配置\n' > outputs/news-tagging/diagnostics.txt
          model_name=$(node -p "require('./experiments/news-tagging/runtime.json').model")
          printf 'NEWS_MODEL=%s\n' "$model_name" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/news-tagger-engine"
          engine_url=$(node -p "require('./experiments/news-tagging/runtime.json').engine_url")
          engine_sha=$(node -p "require('./experiments/news-tagging/runtime.json').engine_sha256")
          printf '下载推理引擎\n' >> outputs/news-tagging/diagnostics.txt
          curl --fail --show-error --location --retry 2 --connect-timeout 30 --max-time 180 "$engine_url" -o "$RUNNER_TEMP/news-engine.zip"
          printf '%s  %s\n' "$engine_sha" "$RUNNER_TEMP/news-engine.zip" | sha256sum -c -
          printf '推理引擎校验通过\n' >> outputs/news-tagging/diagnostics.txt
          unzip -q "$RUNNER_TEMP/news-engine.zip" -d "$RUNNER_TEMP/news-tagger-engine"
          rm -f "$RUNNER_TEMP/news-engine.zip"
          printf '下载模型文件\n' >> outputs/news-tagging/diagnostics.txt
          mkdir -p "$RUNNER_TEMP/news-tagger-model"
          node -e 'for (const file of require("./experiments/news-tagging/runtime.json").model_files) console.log([file.url, file.name, file.sha256].join("|"))' |
          while IFS='|' read -r model_url model_name model_sha; do
            model_path="$RUNNER_TEMP/news-tagger-model/$model_name"
            curl --fail --show-error --location --retry 2 --connect-timeout 30 --max-time 1800 "$model_url" -o "$model_path"
            printf '%s  %s\n' "$model_sha" "$model_path" | sha256sum -c -
          done
          printf '模型文件校验通过\n' >> outputs/news-tagging/diagnostics.txt

      - name: Start CPU inference server and tag the frozen batch
        env:
          NEWS_TAGGING_ENDPOINT: http://127.0.0.1:8080
        run: |
          set -euo pipefail
          printf '定位推理服务程序\n' >> outputs/news-tagging/diagnostics.txt
          server="$RUNNER_TEMP/news-tagger-engine/build/bin/llama-server"
          if [ ! -f "$server" ]; then
            printf '推理服务程序不存在：%s\n' "$server" | tee -a outputs/news-tagging/diagnostics.txt
            exit 1
          fi
          chmod +x "$server"
          library_directory=$(dirname "$server")
          printf '启动推理服务程序\n' >> outputs/news-tagging/diagnostics.txt
          : > outputs/news-tagging/engine.log
          LD_LIBRARY_PATH="$library_directory:${LD_LIBRARY_PATH:-}" "$server" \
            --model "$RUNNER_TEMP/news-tagger-model/qwen2.5-7b-instruct-q4_k_m-00001-of-00002.gguf" --alias "$NEWS_MODEL" \
            --host 127.0.0.1 --port 8080 --ctx-size 8192 \
            --threads 4 --threads-batch 4 --parallel 1 --n-gpu-layers 0 \
            --batch-size 512 --ubatch-size 128 > outputs/news-tagging/engine.log 2>&1 &
          model_server_pid=$!
          trap 'kill "$model_server_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:8080/health > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$model_server_pid" 2>/dev/null; then
              printf '推理服务程序提前退出，详见 engine.log\n' | tee -a outputs/news-tagging/diagnostics.txt
              cat outputs/news-tagging/engine.log
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            printf '推理服务程序启动超时，详见 engine.log\n' | tee -a outputs/news-tagging/diagnostics.txt
            cat outputs/news-tagging/engine.log
            exit 1
          fi
          printf '模型启动完成，开始推理\n' >> outputs/news-tagging/diagnostics.txt
          node experiments/news-tagging/run.mjs
          printf '推理完成\n' >> outputs/news-tagging/diagnostics.txt

      - name: Save validated response cache
        timeout-minutes: 2
        if: always() && hashFiles('outputs/news-tagging/cache/*.json') != ''
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: outputs/news-tagging/cache
          key: news-tagging-7b-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Compare 7B with saved 1.5B results
        if: github.event_name != 'push' && always() && hashFiles('outputs/news-tagging/results.json') != ''
        run: node experiments/news-tagging/compare-models.mjs

      - name: Evaluate refined tags against human audit
        if: github.event_name != 'push' && always() && hashFiles('outputs/news-tagging/results.json') != ''
        run: node experiments/news-tagging/evaluate-human-audit.mjs outputs/news-tagging/results.json --refined > outputs/news-tagging/human-audit-evaluation.json

      - name: Attach tagging report
        if: always()
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const directory = 'outputs/news-tagging/';
          const state = fs.existsSync(directory + 'run-state.json') ? JSON.parse(fs.readFileSync(directory + 'run-state.json', 'utf8')) : {};
          const report = fs.existsSync(directory + 'results.json') ? JSON.parse(fs.readFileSync(directory + 'results.json', 'utf8')) : {};
          const current = state.finishedAt && state.finishedAt === report.generatedAt && state.contextHash === report.contextHash;
          const text = current && fs.existsSync(directory + 'report.md')
            ? fs.readFileSync(directory + 'report.md', 'utf8')
            : '语义打标尚未完成，请检查模型下载、启动和推理日志。';
          const modelComparison = fs.existsSync(directory + 'model-comparison.md') ? fs.readFileSync(directory + 'model-comparison.md', 'utf8') : '';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, text + '\n' + modelComparison);
          JS

      - name: Upload trial output
        timeout-minutes: 3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: industrial-news-semantic-tags-${{ github.run_id }}-${{ matrix.batch }}
          path: outputs/news-tagging/
          retention-days: 14
          if-no-files-found: warn

  combine-fresh-batches:
    if: github.event_name == 'push'
    needs: tag-frozen-news
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: industrial-news-semantic-tags-${{ github.run_id }}-*
          path: outputs/news-tagging/parts
      - name: Combine all complete batches for human review
        run: node experiments/news-tagging/combine-batches.mjs outputs/news-tagging/parts outputs/news-tagging/combined 30
      - uses: actions/upload-artifact@v4
        with:
          name: industrial-news-semantic-tags-${{ github.run_id }}-combined
          path: outputs/news-tagging/combined/
          retention-days: 14
